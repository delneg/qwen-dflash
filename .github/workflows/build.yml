name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Upstream llama.cpp. DFlash 2 landed in ggml-org/llama.cpp#27816 (Aug 27),
# followed by the fused encoder/KV injection (#27310) and mtmd fixes.
# Pinned to release b11213. Bump LLAMA_SHA and LLAMA_BUILD together,
# deliberately, then re-tag: acceptance-critical code lives there.
# LLAMA_BUILD matters because the shallow clone can't count commits: it sets
# the version string and picks the matching prebuilt web UI.
env:
  LLAMA_REPO: https://github.com/ggml-org/llama.cpp
  LLAMA_SHA: cea74625fa0bd59464a6c6f5ac3c1c1ebfec5344
  LLAMA_BUILD: 11213

permissions:
  contents: write

jobs:
  macos-arm64:
    # Needs a macOS 15+ SDK: Metal residency sets (keep weights resident on
    # the GPU) are compiled out otherwise. Upstream releases build here too.
    # The deployment target keeps the binary running on macOS 14.
    runs-on: macos-26
    steps:
      - name: Fetch llama.cpp at pinned SHA
        run: |
          git init llama.cpp
          cd llama.cpp
          git remote add origin "$LLAMA_REPO"
          git fetch --depth 1 origin "$LLAMA_SHA"
          git checkout FETCH_HEAD

      - name: Build llama-server (Metal, static, embedded shaders)
        run: |
          cd llama.cpp
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DLLAMA_BUILD_NUMBER="$LLAMA_BUILD" \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build -j --target llama-server

      - name: Smoke test
        run: |
          ./llama.cpp/build/bin/llama-server --version

      - name: HTTPS download check (fresh cache)
        run: |
          LLAMA_CACHE=$(mktemp -d) ./llama.cpp/build/bin/llama-server \
            -hf Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M --port 8099 > dl.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "listening on http" dl.log && break
            if grep -q "HTTPS is not supported" dl.log; then cat dl.log; exit 1; fi
            sleep 5
          done
          grep -q "listening on http" dl.log || { cat dl.log; exit 1; }
          kill %1 || true

      - name: Portability check (system libs only)
        run: |
          if otool -L llama.cpp/build/bin/llama-server | grep -E "/opt/homebrew|/usr/local"; then
            echo "binary links non-system libraries; it would break on Macs without them" >&2
            exit 1
          fi
          otool -l llama.cpp/build/bin/llama-server | grep -q "minos 14.0" || {
            echo "binary does not target macOS 14.0; README promises 14+" >&2
            exit 1
          }

      - name: Package
        run: |
          mkdir -p dist
          cp llama.cpp/build/bin/llama-server dist/
          tar -C dist -czf llama-server-macos-arm64.tar.gz llama-server
          shasum -a 256 llama-server-macos-arm64.tar.gz > llama-server-macos-arm64.tar.gz.sha256

      - name: Upload artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-macos-arm64
          path: llama-server-macos-arm64.tar.gz*

      - name: Release (tag runs)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            llama-server-macos-arm64.tar.gz
            llama-server-macos-arm64.tar.gz.sha256
